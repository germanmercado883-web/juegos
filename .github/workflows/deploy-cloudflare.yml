name: Deploy to Cloudflare Pages

# Builds the game and publishes it to Cloudflare Pages on every push.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (permission: Cloudflare Pages - Edit).

on:
  push:
    branches: [main, claude/wizardly-carson-eosgss]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: a2ae42a7906c61d029d3a0365619e73b
  PROJECT_NAME: duskvale

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret in Settings > Secrets and variables > Actions"
            exit 1
          fi
      - name: Create Pages project (first run only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 pages project create "$PROJECT_NAME" --production-branch=main || true
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 pages deploy dist --project-name="$PROJECT_NAME" --branch=main --commit-dirty=true
